<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENGLISH CRIC- Live Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a1a3f 0%, #1a0a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(10, 26, 63, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.3), 0 0 40px rgba(0, 150, 255, 0.2);
            border: 2px solid rgba(0, 150, 255, 0.3);
        }

        .header {
            background: linear-gradient(90deg, #ff0000 0%, #0096ff 50%, #ff0000 100%);
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .header p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            margin-top: 8px;
        }

        .player-wrapper {
            background: #000;
            padding: 25px;
            position: relative;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid rgba(0, 150, 255, 0.4);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .controls-panel {
            background: rgba(26, 10, 46, 0.9);
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            border: 2px solid rgba(0, 150, 255, 0.2);
        }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        button, a.btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-play {
            background: linear-gradient(135deg, #ff0000 0%, #ff6600 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            min-width: 120px;
            border: none;
        }

        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.6);
        }

        .btn-fullscreen {
            background: linear-gradient(135deg, #0096ff 0%, #0066cc 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.4);
            min-width: 120px;
            border: none;
        }

        .btn-fullscreen:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 150, 255, 0.6);
        }

        .btn-hindi {
            background: linear-gradient(135deg, #ff6600 0%, #ff0000 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
            width: 100%;
            border: none;
        }

        .btn-hindi:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 102, 0, 0.6);
        }

        select {
            padding: 12px 15px;
            border: 2px solid #0096ff;
            border-radius: 8px;
            background: rgba(0, 150, 255, 0.1);
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 150px;
        }

        select:focus {
            outline: none;
            border-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        select option {
            background: #1a0a2e;
            color: white;
        }

        .status-box {
            background: rgba(0, 150, 255, 0.1);
            border-left: 4px solid #0096ff;
            padding: 12px 15px;
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            flex: 1;
            min-width: 150px;
        }

        .status-box.playing {
            background: rgba(0, 255, 0, 0.1);
            border-left-color: #00ff00;
            color: #00ff00;
        }

        .status-box.error {
            background: rgba(255, 0, 0, 0.1);
            border-left-color: #ff0000;
            color: #ff0000;
        }

        .info-panel {
            background: rgba(0, 150, 255, 0.08);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #0096ff;
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            line-height: 1.6;
        }

        .info-panel strong {
            color: #0096ff;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .control-row {
                flex-direction: column;
            }

            button, select, a.btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 ENGLISH CRIC LIVE</h1>
            <p>High Definition Live Stream Player</p>
        </div>

        <div class="player-wrapper">
            <div class="video-container" id="videoContainer">
                <video id="player" controls autoplay playsinline muted></video>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-row">
                <button class="btn-play" onclick="playStream()">▶ PLAY</button>
                <button class="btn-fullscreen" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
            </div>

            <div class="control-row">
                <select id="qualitySelect" onchange="changeQuality()">
                    <option value="">📺 Select Quality</option>
                </select>
                <div class="status-box" id="statusBox">Ready</div>
            </div>

            <div class="control-row">
                <a href="https://amanchauhan9131-maker.github.io/Sports-live2/" class="btn btn-hindi" target="_blank">🇮🇳 HINDI STREAMS</a>
            </div>

            <div class="info-panel">
                <strong>📌 How to use:</strong><br>
                • Click HINDI STREAMS button to go to Hindi streams page<br>
                • Click PLAY button to play stream<br>
                • Select quality from dropdown (if available)<br>
                • Use FULLSCREEN button for full screen mode
            </div>
        </div>
    </div>

    <script>
        const STREAM_URL = "https://a57live-pv-ta-amazon.akamaized.net/iad-nitro/live/clients/dash/enc/2irdbfdf7v/out/v1/6a7927046ca14cb7920a38c81b3e5abd/cenc.mpd|drmScheme=clearkey&drmLicense=4fee2b582adfdc337dcb121b5bdbc0ec:ed256ea2e5a187fb9d23d922621ec02b";

        const video = document.getElementById('player');
        const qualitySelect = document.getElementById('qualitySelect');
        const statusBox = document.getElementById('statusBox');
        const videoContainer = document.getElementById('videoContainer');

        let hls = null;
        let dashPlayer = null;
        let currentStreamConfig = null;

        function updateStatus(message, type = '') {
            statusBox.textContent = message;
            statusBox.className = 'status-box' + (type ? ' ' + type : '');
        }

        function parseStreamConfig(rawUrl) {
            const [streamPart, paramsPart] = String(rawUrl || '').split('|');
            const params = new URLSearchParams(paramsPart || '');
            const drmLicense = params.get('drmLicense') || '';
            const drmParts = drmLicense.includes(':') ? drmLicense.split(':') : [];

            return {
                streamUrl: (streamPart || '').trim(),
                drmScheme: params.get('drmScheme') || '',
                keyId: drmParts[0] ? drmParts[0].trim().toLowerCase() : '',
                key: drmParts[1] ? drmParts[1].trim().toLowerCase() : ''
            };
        }

        function stopCurrentPlayback() {
            if (hls) {
                try { hls.destroy(); } catch (e) { console.error('HLS destroy error:', e); }
                hls = null;
            }

            if (dashPlayer) {
                try { dashPlayer.reset(); } catch (e) { console.error('Dash reset error:', e); }
                dashPlayer = null;
            }

            video.pause();
            video.removeAttribute('src');
            video.load();
        }

        function addDashQualityOptions() {
            if (!dashPlayer) return;
            try {
                const list = dashPlayer.getBitrateInfoListFor('video') || [];
                if (!Array.isArray(list) || list.length === 0) return;

                qualitySelect.innerHTML = '<option value="">📺 Select Quality</option>';
                list.forEach((item, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${item.height || 'Auto'}p (${Math.round(item.bitrate / 1000)} kbps)`;
                    qualitySelect.appendChild(option);
                });
            } catch (error) {
                console.error('Unable to load DASH quality options:', error);
            }
        }

        function playDashStream() {
            if (!window.dashjs) {
                updateStatus('❌ DASH.js not loaded', 'error');
                return;
            }

            try {
                stopCurrentPlayback();
                dashPlayer = window.dashjs.MediaPlayer().create();

                if (currentStreamConfig && currentStreamConfig.keyId && currentStreamConfig.key) {
                    dashPlayer.setProtectionData({
                        'org.w3.clearkey': {
                            clearkeys: {
                                [currentStreamConfig.keyId]: currentStreamConfig.key
                            }
                        }
                    });
                }

                dashPlayer.initialize(video, currentStreamConfig.streamUrl, true);

                dashPlayer.on('error', function() {
                    updateStatus('❌ DASH Stream Error', 'error');
                });

                dashPlayer.on('playbackInitialized', function() {
                    updateStatus('✅ Stream Connected', 'playing');
                    addDashQualityOptions();
                    video.play().catch(() => console.log('Autoplay blocked by browser'));
                });

                dashPlayer.on('bufferStalled', function() {
                    updateStatus('⏳ Buffering...', 'info');
                });
            } catch (error) {
                console.error('DASH init error:', error);
                updateStatus('❌ Error: ' + error.message, 'error');
            }
        }

        function playHlsStream() {
            if (!window.Hls) {
                updateStatus('❌ HLS.js not supported in this browser', 'error');
                return;
            }

            try {
                stopCurrentPlayback();

                hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                });

                hls.loadSource(currentStreamConfig.streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    updateStatus('✅ Stream Connected', 'playing');
                    const levels = hls.levels || [];
                    qualitySelect.innerHTML = '<option value="">📺 Select Quality</option>';
                    levels.forEach((level, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = `${level.height || 'Auto'}p (${Math.round(level.bitrate / 1000)} kbps)`;
                        qualitySelect.appendChild(option);
                    });
                    video.play().catch(() => console.log('Autoplay blocked by browser'));
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('HLS Error:', data);
                    if (data.fatal) {
                        updateStatus('❌ Stream Error: ' + (data.type || 'Unknown'), 'error');
                    }
                });
            } catch (error) {
                console.error('HLS init error:', error);
                updateStatus('❌ Error: ' + error.message, 'error');
            }
        }

        function playStream() {
            currentStreamConfig = parseStreamConfig(STREAM_URL);

            if (!currentStreamConfig.streamUrl) {
                updateStatus('❌ Stream URL not configured', 'error');
                return;
            }

            updateStatus('⏳ Loading stream...', 'info');
            qualitySelect.innerHTML = '<option value="">📺 Select Quality</option>';

            if (currentStreamConfig.streamUrl.toLowerCase().endsWith('.mpd') || currentStreamConfig.streamUrl.toLowerCase().includes('.mpd')) {
                playDashStream();
            } else if (currentStreamConfig.streamUrl.toLowerCase().endsWith('.m3u8')) {
                playHlsStream();
            } else {
                updateStatus('❌ Unsupported stream format', 'error');
            }
        }

        function changeQuality() {
            const selected = qualitySelect.value;
            if (selected === '') return;

            if (hls) {
                if (!hls.levels[selected]) return;
                hls.currentLevel = parseInt(selected, 10);
                const level = hls.levels[selected];
                updateStatus(`✅ Quality changed to ${level.height || 'Auto'}p`, 'playing');
                return;
            }

            if (dashPlayer) {
                const list = dashPlayer.getBitrateInfoListFor('video') || [];
                if (list[selected]) {
                    dashPlayer.setQualityFor('video', parseInt(selected, 10));
                    const level = list[selected];
                    updateStatus(`✅ Quality changed to ${level.height || 'Auto'}p`, 'playing');
                }
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoContainer.requestFullscreen().catch(() => {
                    alert('Fullscreen not available');
                });
            } else {
                document.exitFullscreen();
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            updateStatus('Ready', '');
        });
    </script>
</body>
</html>
